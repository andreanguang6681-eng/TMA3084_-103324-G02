
name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/menu

jobs:
  analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "LAB EXERCISE 3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze
